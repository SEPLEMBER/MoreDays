// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        gradleVersion = '7.4.0'
        kotlinVersion = '1.8.0'
        coreVersion = '1.9.0'
        materialVersion = '1.8.0'
        constraintLayoutVersion = '2.1.4'
        gridLayoutVersion = '1.1.0'
        appCompatVersion = '1.6.1'
        roomVersion = '2.5.0'
        iconPickerVersion = '3.3.0'
        colorPickerVersion = '2.2.4'
        aboutVersion = '10.6.1'
        emojiVersion = '1.2.0'
        coroutinesVersion = '1.6.4'
        archLifecycleVersion = '2.6.0'
        archVersion = '2.1.0'
        navigationVersion = '2.5.3'
        lottieVersion = '6.0.0'
        dataBindingCompilerVersion = gradleVersion // Always need to be the same.
    }
    repositories {
        google()
        mavenCentral()
        // for apache poi
        maven { url 'https://jitpack.io' }
        //for aboutlibrary
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:$aboutVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        //for chart lib and aboutlibraries
        maven { url 'https://www.jitpack.io' }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
            //options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}



task clean(type: Delete) {
    delete rootProject.buildDir
}
