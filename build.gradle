// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        gradleVersion = '8.3.0'
        kotlinVersion = '1.9.23'
        coreVersion = '1.12.0'
        materialVersion = '1.11.0'
        constraintLayoutVersion = '2.1.4'
        gridLayoutVersion = '1.1.0'
        appCompatVersion = '1.6.1'
        roomVersion = '2.6.1'
        iconPickerVersion = '3.3.0'
        colorPickerVersion = '2.3.0'
        aboutVersion = '11.1.0'
        emojiVersion = '1.4.0'
        coroutinesVersion = '1.8.0'
        archLifecycleVersion = '2.7.0'
        archVersion = '2.1.0'
        navigationVersion = '2.7.7'
        //stick to 2.6, as 2.7 caused compile problems, see https://developer.android.com/jetpack/androidx/releases/navigation#groovy
        lottieVersion = '6.4.0'
        dataBindingCompilerVersion = gradleVersion // Always need to be the same.
    }
    repositories {
        google()
        mavenCentral()
        // for apache poi
        maven { url 'https://jitpack.io' }
        //for aboutlibrary
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:$aboutVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        //for chart lib and aboutlibraries
        maven { url 'https://www.jitpack.io' }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.encoding = 'UTF-8'
                //options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
}


tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
