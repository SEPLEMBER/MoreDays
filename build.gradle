// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        gradleVersion = '4.1.3'
        kotlinVersion = '1.4.32'
        coreVersion = '1.3.2'
        materialVersion = '1.3.0'
        constraintLayoutVersion = '2.0.4'
        gridLayoutVersion = '1.1.0'
        appCompatVersion = '1.2.0'
        roomVersion = '2.2.6'
        iconPickerVersion = '3.3.0'
        colorPickerVersion = '2.2.2'
        aboutVersion = '8.8.4'
        flexBoxVersion = '2.0.1'
        //coreTestingVersion = '2.1.0'
        coroutinesVersion = '1.4.2'
        archLifecycleVersion = '2.3.1'
        archVersion = '2.1.0'
        navigationVersion = '2.3.5'
        dataBindingCompilerVersion = gradleVersion // Always need to be the same.

    }
    repositories {
        google()
        jcenter()
        mavenCentral()
        //maven { url 'https://jitpack.io' }
        //for aboutlibrary
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:$aboutVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        //mavenCentral()
        //for chart lib and aboutlibraries
        maven { url 'https://www.jitpack.io' }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}



task clean(type: Delete) {
    delete rootProject.buildDir
}
