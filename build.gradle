// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        gradleVersion = '7.1.3'
        kotlinVersion = '1.6.20'
        coreVersion = '1.7.0'
        materialVersion = '1.5.0'
        constraintLayoutVersion = '2.1.3'
        gridLayoutVersion = '1.1.0'
        appCompatVersion = '1.4.1'
        roomVersion = '2.4.2'
        iconPickerVersion = '3.3.0'
        colorPickerVersion = '2.2.4'
        aboutVersion = '10.1.0'
        emojiVersion = '1.1.0'
        coroutinesVersion = '1.6.1-native-mt'
        archLifecycleVersion = '2.4.1'
        archVersion = '2.1.0'
        navigationVersion = '2.4.1'
        lottieVersion = '5.0.3'
        dataBindingCompilerVersion = gradleVersion // Always need to be the same.
    }
    repositories {
        google()
        mavenCentral()
        //maven { url 'https://jitpack.io' }
        //for aboutlibrary
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:$aboutVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        //for chart lib and aboutlibraries
        maven { url 'https://www.jitpack.io' }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
            //options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}



task clean(type: Delete) {
    delete rootProject.buildDir
}
