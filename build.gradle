// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        gradleVersion = '4.1.1'
        kotlinVersion = '1.4.21'
        coreVersion = '1.3.2'
        materialVersion = '1.2.1'
        constraintLayoutVersion = '2.0.4'
        gridLayoutVersion = '1.1.0'
        appCompatVersion = '1.2.0'
        fragmentVersion = '1.1.0-alpha09'
        roomVersion = '2.3.0-alpha04'
        iconPickerVersion = '3.3.0'
        colorPickerVersion = '2.2.2'
        aboutVersion = '8.6.5'
        flexBoxVersion = '2.0.1'
        //coreTestingVersion = '2.1.0'
        coroutinesVersion = '1.4.2'
        archLifecycleVersion = '2.2.0'
        archVersion = '2.1.0'
        navigationVersion = '2.3.2'
        dataBindingCompilerVersion = gradleVersion // Always need to be the same.
    }
    repositories {
        google()
        jcenter()

        //for aboutlibrary
        maven { url 'https://maven.fabric.io/public' }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:$aboutVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
